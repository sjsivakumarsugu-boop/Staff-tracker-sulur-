<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff Tracker - Coimbatore - Sulur</title>
<style>
:root{--bg:#fff6e5;--card:#fffdf7;--tx:#2b1608;--mu:#85644a;--bd:#f1d9b5;--ac:#e8590c;--ok:#16a34a;--bad:#dc2626;--wn:#d97706}
@media(prefers-color-scheme:dark){:root{--bg:#1a0b05;--card:#2a1209;--tx:#fff1dc;--mu:#d2a77f;--bd:#4d2615;--ac:#f97316}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
input,button{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}input{min-width:0}
button{cursor:pointer;background:var(--ac);color:#fff;border:0;font-weight:600}button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.d{background:var(--bad)}
.tabs button{background:transparent;color:var(--mu);border:1px solid var(--bd)}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}.stat b{display:block;font-size:24px}.stat span{color:var(--mu);font-size:13px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-size:12px;text-transform:uppercase}
td input{width:70px;padding:6px 8px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;min-width:80px}.bar i{display:block;height:100%;background:var(--ac)}.bar.ok i{background:var(--ok)}
.pill{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;color:#fff}
.mu{color:var(--mu)}.c{text-align:center}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:12px 0}
.slots label{font-size:12px;color:var(--mu);display:block;margin-bottom:4px}.slots input{width:100%}
#wrap{position:relative;width:min(320px,100%);margin:10px auto}canvas{width:100%;height:auto;display:block}
.ptr{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:30px;color:var(--bad);line-height:1}
.prize{font-size:20px;font-weight:700;text-align:center;margin:10px 0;color:var(--ok)}
.login{max-width:360px;margin:10vh auto}.login input{width:100%;margin:6px 0}
.err{color:var(--bad);font-size:13px;min-height:18px}
.link{background:none;color:var(--ac);padding:4px;font-weight:500;border:0}

:root{--gold:#f5b301}
.card{border-top:3px solid var(--gold)}
.dw{background:linear-gradient(135deg,#7f1d1d,#c2410c 55%,#f59e0b);color:#fff;border-radius:14px;padding:12px 10px;text-align:center;margin-bottom:14px;cursor:pointer;box-shadow:0 4px 14px rgba(194,65,12,.35)}
.dwt{font-size:20px;font-weight:800;letter-spacing:.3px}.dws{font-size:13px;opacity:.95}
.lights{letter-spacing:6px;animation:tw 1.6s ease-in-out infinite alternate;font-size:18px}
@keyframes tw{from{opacity:.55;transform:scale(.98)}to{opacity:1;transform:scale(1.02)}}
.diyas{display:flex;gap:8px;justify-content:center;margin:12px 0 4px}
.diyas span{font-size:32px;opacity:.22;filter:grayscale(1);transition:.4s}
.diyas span.on{opacity:1;filter:drop-shadow(0 0 8px #ffb703);animation:fl 1.1s ease-in-out infinite alternate}
@keyframes fl{from{transform:translateY(0) scale(1)}to{transform:translateY(-2px) scale(1.08)}}
.motive{text-align:center;font-weight:700;color:var(--ac);margin:4px 0 2px}
.pt{position:fixed;top:-40px;z-index:99;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script></head><body><div id="app"><p class="mu c">Loading…</p></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== PASTE YOUR FIREBASE CONFIG HERE (see setup steps) ====== */
const firebaseConfig={apiKey:"AIzaSyCCXg7Op1dM1NPiVtzgOL3n-b4aOItu9-o",authDomain:"staff-tracker-sulur.firebaseapp.com",projectId:"staff-tracker-sulur",storageBucket:"staff-tracker-sulur.firebasestorage.app",messagingSenderId:"746993258228",appId:"1:746993258228:web:578d4e78d4262b35cf98a1"};
/* =============================================================== */

const SL=["2pm","4pm","6pm","8pm","Closing"];
const COL=["#b91c1c","#f59e0b","#c2410c","#7c2d12","#d97706","#9f1239","#ea580c","#a16207"];
const S={staff:{},logs:{},cfg:{items:["Sweet box 🍬","Bonus ₹100","Gift voucher","Dry fruits box","Extra 30 min break","Better luck next time"],targets:{},storeTargets:{}}};
let me=JSON.parse(localStorage.getItem("me")||"null"),tab="dash",date=today(),pending=false,spinning=false,err="",mgrForm=false,ready=false;
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cid=s=>String(s).trim().toUpperCase().replace(/[^A-Z0-9_-]/g,"");
const $=s=>document.querySelector(s);
const hash=async(c,p)=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode("stt:"+c+":"+p)))].map(b=>b.toString(16).padStart(2,"0")).join("");

if(firebaseConfig.apiKey==="PASTE"){document.getElementById("app").innerHTML='<div class="card login"><h1>Setup needed</h1><p>Paste your Firebase config into index.html (see the setup steps).</p></div>';throw new Error("no config")}
const app=initializeApp(firebaseConfig),auth=getAuth(app),fdb=getFirestore(app);
let subs=false;
onAuthStateChanged(auth,u=>{
  if(!u){signInAnonymously(auth).catch(e=>{err=e.message;render(true)});return}
  if(subs)return;subs=true;
  onSnapshot(collection(fdb,"staff"),q=>{S.staff={};q.forEach(d=>S.staff[d.id]=d.data());ready=true;render()});
  onSnapshot(collection(fdb,"logs"),q=>{S.logs={};q.forEach(d=>S.logs[d.id]=d.data());render()});
  onSnapshot(doc(fdb,"config","main"),s=>{if(s.exists())S.cfg={...S.cfg,...s.data()};render()});
});
const isMgr=()=>!!auth.currentUser?.email;
function put(col,id,v){S[col][id]=v;setDoc(doc(fdb,col,id),v).catch(e=>{alert("Save failed: "+e.message)});render(true)}
function del(col,id){delete S[col][id];deleteDoc(doc(fdb,col,id)).catch(e=>alert(e.message));render(true)}
function putCfg(){setDoc(doc(fdb,"config","main"),S.cfg).catch(e=>alert("Save failed: "+e.message));render(true)}

const lk=(d,c)=>d+"_"+c;
const n=x=>Number(x||0).toLocaleString("en-IN");
const storeT=d=>Number(S.cfg.storeTargets?.[d]||0);
function normDate(v){if(typeof v==="number"){const d=new Date(Math.round((v-25569)*864e5));return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0")}
 v=String(v||"").trim();let m=v.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);if(m)return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
 m=v.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);if(m)return m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");return null}
function setStoreT(){const v=document.getElementById("tg").value;if(v==="")return;S.cfg.storeTargets={...S.cfg.storeTargets,[date]:Number(v)};putCfg()}
function setSplit(b){S.cfg.splitEqual=b;putCfg()}
function tpl(){const d=new Date(),y=d.getFullYear(),m=d.getMonth(),last=new Date(y,m+1,0).getDate(),rows=[["Date","Target"]];for(let i=1;i<=last;i++)rows.push([y+"-"+String(m+1).padStart(2,"0")+"-"+String(i).padStart(2,"0"),""]);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),"Targets");XLSX.writeFile(wb,"store-target-template.xlsx")}
async function upT(inp){const f=inp.files[0];if(!f)return;try{const wb=XLSX.read(await f.arrayBuffer(),{type:"array"}),rs=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""}),out={};let bad=0;
 rs.forEach(r=>{const ks=Object.keys(r),dk=ks.find(k=>/date/i.test(k))||ks.find(k=>/day/i.test(k)),tk=ks.find(k=>/target/i.test(k)&&k!==dk),d=dk?normDate(r[dk]):null,t=tk?Number(String(r[tk]).replace(/,/g,"")):NaN;if(d&&t>=0&&!isNaN(t))out[d]=t;else bad++});
 const c=Object.keys(out).length;if(!c){alert("No valid rows found. Use two columns: Date, Target.");inp.value="";return}
 S.cfg.storeTargets={...S.cfg.storeTargets,...out};putCfg();alert(c+" days uploaded"+(bad?", "+bad+" rows skipped":""))}catch(e){alert("Could not read file: "+e.message)}inp.value=""}
const banner=`<div class="dw" onclick="burst()"><div class="lights">🪔 ✨ 🪔 ✨ 🪔 ✨ 🪔</div><div class="dwt">DIWALI SALES DHAMAKA</div><div class="dws">This Diwali, Let Every Bill Sparkle 🎆</div></div>`;
const diyas=p=>`<div class="diyas">${[20,40,60,80,100].map(x=>`<span class="${p>=x?"on":""}">🪔</span>`).join("")}</div>`;
const motive=(p,ok)=>ok?"Target smashed! 🎆 Spin the wheel and shine!":p>=75?"Almost there — one last push to light every diya! 🔥":p>=50?"Halfway lit! Keep the sparkle going ✨":p>0?"Great start — keep lighting those diyas! 🪔":"Light the first diya — make that first sale! 🪔";
function burst(){const e=["🎆","✨","🪔","🎇","⭐","🪙"];for(let i=0;i<40;i++){const q=document.createElement("div");q.className="pt";q.textContent=e[i%e.length];q.style.left=Math.random()*100+"vw";q.style.animationDuration=(2+Math.random()*2.5)+"s";q.style.fontSize=(16+Math.random()*20)+"px";document.body.appendChild(q);setTimeout(()=>q.remove(),4800)}}
const ymd=dt=>dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
function setStaffT(c,v){const o={...(S.cfg.staffTargets||{})},day={...(o[date]||{})};if(v==="")delete day[c];else day[c]=Number(v)||0;o[date]=day;S.cfg.staffTargets=o;putCfg()}
function resetDayT(){const o={...(S.cfg.staffTargets||{})};delete o[date];S.cfg.staffTargets=o;putCfg()}
function copyPrev(){const p=new Date(date+"T00:00:00");p.setDate(p.getDate()-1);const src=S.cfg.staffTargets?.[ymd(p)];if(!src){alert("No staff targets set for "+ymd(p));return}S.cfg.staffTargets={...(S.cfg.staffTargets||{}),[date]:{...src}};putCfg()}
const autoT=(c,d)=>{const st=storeT(d),m=Object.keys(S.staff).length;if(S.cfg.splitEqual!==false&&st&&m)return Math.ceil(st/m);return Number(S.cfg.targets?.[d]??S.staff[c]?.target??0)};
const targetOf=(c,d)=>{const o=S.cfg.staffTargets?.[d]?.[c];return o!==undefined&&o!==""?Number(o):autoT(c,d)};
function achieved(l){let v=0;SL.forEach(s=>{const x=l?.slots?.[s];if(x!==undefined&&x!==""&&x!==null)v=Number(x)});return v}
function setSlot(c,d,s,val){const k=lk(d,c),l=S.logs[k]||{date:d,code:c,slots:{}};if(l.spun&&!isMgr()){alert("Already spun today — entries are locked.");return render(true)}l.slots={...l.slots,[s]:val===""?"":Number(val)};put("logs",k,l)}

function render(force){
  if(!force&&document.activeElement?.tagName==="INPUT"){pending=true;return}
  pending=false;if(spinning)return;
  if(!ready&&!force)return;
  if(me&&me.role==="s"&&ready&&!S.staff[me.code]){me=null;localStorage.removeItem("me")}
  if(me?.role==="m"&&!isMgr()&&auth.currentUser){me=null;localStorage.removeItem("me")}
  $("#app").innerHTML=!me?loginV():me.role==="m"?mgrV():staffV();
  if(me?.role==="s")drawWheel(0);
}
document.addEventListener("focusout",()=>setTimeout(()=>{if(pending&&document.activeElement?.tagName!=="INPUT")render()},50));

function loginV(){return mgrForm?`<div class="card login"><h1>Manager login</h1><div class="mu" style="margin-bottom:8px">Staff Tracker · Coimbatore - Sulur</div><input id="me" type="email" placeholder="Manager email"><input id="mp" type="password" placeholder="Password"><div class="err">${esc(err)}</div>
<button style="width:100%" onclick="mgrLogin()">Login</button><button class="link" onclick="mgrForm=false;err='';render(true)">← Staff login</button></div>`
:`<div class="card login">${banner}<h1>Staff Tracker</h1><div class="mu" style="margin-bottom:8px">Store: Coimbatore - Sulur</div><p class="mu">Login with your employee code</p>
<input id="lc" placeholder="Employee code" autocapitalize="characters">
<div class="err">${esc(err)}</div><button style="width:100%" onclick="login()">Login</button><button class="link" onclick="mgrForm=true;err='';render(true)">Manager login</button></div>`}
async function login(){const c=cid($("#lc").value);err="";const s=S.staff[c];
  if(!s)err="Employee code not found";else{me={role:"s",code:c};localStorage.setItem("me",JSON.stringify(me))}render(true)}
async function mgrLogin(){err="";try{await signInWithEmailAndPassword(auth,$("#me").value.trim(),$("#mp").value);me={role:"m"};localStorage.setItem("me",JSON.stringify(me))}catch(e){err="Wrong email or password"}render(true)}
async function logout(){const m=isMgr();me=null;localStorage.removeItem("me");mgrForm=false;if(m){subs=false;await signOut(auth)}render(true)}
const head=t=>`${banner}<div class="mu" style="font-size:12px;font-weight:700;letter-spacing:.5px;margin-bottom:4px">STAFF TRACKER · COIMBATORE - SULUR</div><div class="row sp" style="margin-bottom:14px"><h1>${t}</h1><button class="g" onclick="logout()">Logout</button></div>`;

function staffV(){
  const c=me.code,st=S.staff[c];if(!st)return "";const d=today(),l=S.logs[lk(d,c)]||{slots:{}},t=targetOf(c,d),v=achieved(l),pct=t?Math.min(100,Math.round(v/t*100)):0,ok=t>0&&v>=t;
  return head("Hi, "+esc(st.name))+`<div class="card"><div class="row sp"><div><div class="mu">Today's target</div><b style="font-size:28px">${t}</b></div><div><div class="mu">Achieved</div><b style="font-size:28px">${v}</b></div><div><div class="mu">Progress</div><b style="font-size:28px">${pct}%</b></div></div>
<div class="bar ${ok?"ok":""}" style="margin-top:12px"><i style="width:${pct}%"></i></div>${diyas(pct)}<div class="motive">${motive(pct,ok)}</div>
<h2 style="margin-top:16px">Update achieved count (running total)</h2>
<div class="slots">${SL.map(s=>`<div><label>${s}</label><input type="number" min="0" inputmode="numeric" value="${l.slots?.[s]??""}" ${l.spun?"disabled":""} onchange="setSlot('${c}','${d}','${s}',this.value)"></div>`).join("")}</div></div>
${topV(d,"Today's Diwali Stars")}<div class="card c"><h2>Spin the wheel</h2>${ok?(l.spun?`<p class="mu">You already spun today 🎉</p><div class="prize">🎁 ${esc(l.prize)}</div>`:`<p class="mu">Target achieved! Spin to win a reward.</p><div id="wrap"><div class="ptr">▼</div><canvas id="cv" width="640" height="640"></canvas></div><div class="prize" id="pz"></div><button id="sb" onclick="spin()">SPIN</button>`):`<p class="mu">Achieve today's target to unlock the spin wheel. ${t-v>0?`${t-v} more to go!`:""}</p>`}</div>`}
function drawWheel(rot){
  const cv=$("#cv");if(!cv)return;const x=cv.getContext("2d"),it=S.cfg.items,n=it.length||1,a=2*Math.PI/n,R=320;
  x.clearRect(0,0,640,640);x.save();x.translate(R,R);
  it.forEach((t,i)=>{const s=rot+i*a-Math.PI/2;x.beginPath();x.moveTo(0,0);x.arc(0,0,R-4,s,s+a);x.fillStyle=COL[i%COL.length];x.fill();x.strokeStyle="#fff";x.lineWidth=3;x.stroke();
    x.save();x.rotate(s+a/2);x.fillStyle="#fff";x.font="bold 26px system-ui";x.textAlign="right";x.fillText(t.length>16?t.slice(0,15)+"…":t,R-24,9);x.restore()});
  x.restore()}
function spin(){
  const c=me.code,d=today(),k=lk(d,c),l=S.logs[k],it=S.cfg.items;if(spinning||!l||l.spun||it.length<1)return;
  const i=Math.floor(Math.random()*it.length),a=2*Math.PI/it.length;spinning=true;$("#sb").disabled=true;
  S.logs[k]={...l,spun:true,prize:it[i],spunAt:new Date().toISOString()};setDoc(doc(fdb,"logs",k),S.logs[k]).catch(e=>alert(e.message));
  const fin=2*Math.PI*6+((2*Math.PI-(i+.5)*a)%(2*Math.PI)),t0=performance.now();
  (function f(now){const p=Math.min(1,(now-t0)/5000),e=1-Math.pow(1-p,3);drawWheel(fin*e);
    if(p<1)requestAnimationFrame(f);else{spinning=false;$("#pz").textContent="🪔 Happy Diwali! You won: "+it[i]+"!";burst();$("#sb").style.display="none"}})(t0)}

function mgrV(){const tb=[["dash","Dashboard"],["staff","Staff"],["wheel","Spin wheel items"]];
  return head("Manager")+`<div class="row tabs" style="margin-bottom:14px">${tb.map(([k,n])=>`<button class="${tab===k?"on":""}" onclick="setTab('${k}')">${n}</button>`).join("")}</div>`+(tab==="dash"?dashV():tab==="staff"?staffMV():wheelV())}
function ranked(d){return Object.keys(S.staff).map(c=>{const l=S.logs[lk(d,c)]||{slots:{}},t=targetOf(c,d),v=achieved(l);return{c,t,v,p:t?Math.round(v/t*100):0}}).filter(r=>r.v>0).sort((a,b)=>b.p-a.p||b.v-a.v).slice(0,3)}
function topV(d,title){const r=ranked(d),m=["🥇","🥈","🥉"];return `<div class="card"><h2>🏆 ${title}</h2>${r.length?`<div class="stats" style="margin:0">${r.map((x,i)=>`<div class="stat"><span style="font-size:30px">${m[i]}</span><b style="font-size:18px">${esc(S.staff[x.c].name)}</b><span>${x.v} / ${x.t} · ${x.p}%</span></div>`).join("")}</div>`:`<p class="mu" style="margin:0">No entries yet today.</p>`}</div>`}
function dashV(){
  const cs=Object.keys(S.staff).sort(),mo=date.slice(0,7),pc=(a,b)=>b?Math.round(a/b*100):0;
  const rows=cs.map(c=>{const l=S.logs[lk(date,c)]||{slots:{}},t=targetOf(c,date),v=achieved(l),p=pc(v,t);let mv=0;
    Object.keys(S.logs).forEach(k=>{const g=S.logs[k];if(g.code===c&&String(g.date).slice(0,7)===mo&&g.date<=date)mv+=achieved(g)});return{c,l,t,v,p,mv,ok:t>0&&v>=t}});
  const sv=rows.reduce((s,r)=>s+r.v,0),smv=rows.reduce((s,r)=>s+r.mv,0),st=storeT(date),ds=Object.keys(S.cfg.storeTargets||{}).filter(d=>d.slice(0,7)===mo);
  const mt=ds.reduce((s,d)=>s+storeT(d),0),mtd=ds.filter(d=>d<=date).reduce((s,d)=>s+storeT(d),0),done=rows.filter(r=>r.ok).length;
  const k=(b,s,c)=>`<div class="stat"><b${c?` style="color:var(--${c})"`:""}>${b}</b><span>${s}</span></div>`,col=x=>x>=100?"ok":x>=70?"wn":"bad";
  return `<div class="card row"><label>Date <input type="date" value="${date}" onchange="setDate(this.value)"></label>
<label>Store target (this day) <input id="tg" type="number" min="0" style="width:110px" value="${st||""}"></label><button onclick="setStoreT()">Set</button><button class="g" onclick="copyPrev()">Copy yesterday's staff targets</button><button class="g" onclick="resetDayT()">Reset day to auto</button>
<label class="row" style="gap:6px"><input type="checkbox" style="width:auto" ${S.cfg.splitEqual!==false?"checked":""} onchange="setSplit(this.checked)"> Split store target equally among staff</label></div>
<div class="card row sp"><div><h2 style="margin:0">Monthly target upload</h2><div class="mu" style="font-size:13px">Excel or CSV with 2 columns: Date, Target (one row per day)</div></div>
<div class="row"><button class="g" onclick="tpl()">Download template</button><button onclick="document.getElementById('xf').click()">Upload Excel</button><input id="xf" type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="upT(this)"></div></div>
${topV(date,"Diwali Stars · Top 3 of the day")}
<div class="card"><div class="row sp"><b>🪔 Store Sale Meter</b><span>${n(sv)} / ${n(st)} · ${pc(sv,st)}%</span></div><div class="bar ${pc(sv,st)>=100?"ok":""}" style="height:14px;margin-top:8px"><i style="width:${Math.min(100,pc(sv,st))}%"></i></div><div class="mu" style="margin-top:6px">${st?(pc(sv,st)>=100?"Store target smashed! 🎆 Celebrate the team!":"Keep pushing — "+n(Math.max(0,st-sv))+" to go to light up the day! 🪔"):"Upload or set the store target to start the meter."}</div></div>
<div class="stats">${k(n(st),"Store target (day)")}${k(n(sv),"Store achieved (day)")}${k(pc(sv,st)+"%","Day achievement",st?col(pc(sv,st)):"")}${k(n(Math.max(0,st-sv)),"Gap to day target")}
${k(n(mt),"Month target")}${k(n(smv),"Month achieved (till date)")}${k(pc(smv,mtd)+"%","Month-to-date vs target",mtd?col(pc(smv,mtd)):"")}${k(n(Math.max(0,mt-smv)),"Left for the month")}
${k(n(rows.reduce((s,r)=>s+r.t,0)),"Total staff targets (day)")}${k(done+" / "+rows.length,"Staff hit target")}${k(n(rows.length?Math.round(sv/rows.length):0),"Avg per staff (day)")}</div>
<div class="card tw"><h2>Bi-hourly tracker (running totals — editable)</h2><div class="mu" style="font-size:13px;margin:-4px 0 10px">Type a number in the Target column to fix that staff member's target for this day. Leave it blank to use the automatic split.</div><table><tr><th>Staff</th><th>Target</th>${SL.map(s=>`<th>${s}</th>`).join("")}<th>Progress</th><th>Status</th><th>Day contribution</th><th>Month sales</th><th>Month contribution</th><th>Spin prize</th></tr>
${rows.map(r=>`<tr><td><b>${esc(S.staff[r.c].name)}</b><div class="mu" style="font-size:12px">${esc(r.c)}</div></td><td><input type="number" min="0" value="${S.cfg.staffTargets?.[date]?.[r.c]??""}" placeholder="${n(autoT(r.c,date))}" onchange="setStaffT('${r.c}',this.value)"></td>${SL.map(s=>`<td><input type="number" min="0" value="${r.l.slots?.[s]??""}" onchange="setSlot('${r.c}','${date}','${s}',this.value)"></td>`).join("")}
<td><div class="bar ${r.ok?"ok":""}"><i style="width:${Math.min(100,r.p)}%"></i></div><span class="mu" style="font-size:12px">${r.p}%</span></td>
<td><span class="pill" style="background:var(--${r.ok?"ok":r.v?"wn":"mu"})">${r.ok?"Achieved":r.v?"In progress":"Not started"}</span></td>
<td><b>${pc(r.v,sv)}%</b> <span class="mu" style="font-size:12px">of store</span></td><td>${n(r.mv)}</td><td><b>${pc(r.mv,smv)}%</b></td>
<td>${r.l.spun?"🎁 "+esc(r.l.prize):r.ok?'<span class="mu">Not spun yet</span>':"-"}</td></tr>`).join("")||`<tr><td colspan="13" class="mu">No staff yet. Add staff in the Staff tab.</td></tr>`}</table></div>`}
function staffMV(){
  return `<div class="card"><h2>Add / update staff</h2><div class="row"><input id="sc" placeholder="Employee code"><input id="sn" placeholder="Name"><input id="st" type="number" min="0" placeholder="Default target" style="width:120px"><button onclick="addS()">Save</button></div>
<div class="err">${esc(err)}</div><p class="mu" style="font-size:13px">Staff log in with their employee code only. The daily target below is used only when no store target is set for that day.</p></div>
<div class="card tw"><h2>Staff list</h2><table><tr><th>Code</th><th>Name</th><th>Default daily target</th><th></th></tr>
${Object.keys(S.staff).sort().map(c=>`<tr><td>${esc(c)}</td><td>${esc(S.staff[c].name)}</td><td><input type="number" min="0" value="${S.staff[c].target}" onchange="updT('${c}',this.value)"></td><td><button class="d" onclick="delS('${c}')">Remove</button></td></tr>`).join("")||`<tr><td colspan="4" class="mu">No staff added.</td></tr>`}</table></div>`}
function wheelV(){
  return `<div class="card"><h2>Spin wheel items (set by manager)</h2>
${S.cfg.items.map((t,i)=>`<div class="row" style="margin-bottom:8px"><span style="width:14px;height:14px;border-radius:4px;background:${COL[i%COL.length]}"></span><input value="${esc(t)}" style="flex:1" onchange="updI(${i},this.value)"><button class="d" onclick="delI(${i})">✕</button></div>`).join("")}
<div class="row"><input id="ni" placeholder="New reward" style="flex:1"><button onclick="addI()">Add item</button></div><p class="mu" style="font-size:13px">Use at least 2 items. Each staff member can spin once per day after reaching the target.</p></div>`}

const fn={burst,setStaffT,resetDayT,copyPrev,setStoreT,setSplit,tpl,upT,render,login,mgrLogin,logout,setSlot,spin,
 setTab:k=>{tab=k;render(true)},setDate:v=>{date=v;render(true)},
 setT:()=>{const v=$("#tg").value;if(v==="")return;S.cfg.targets={...S.cfg.targets,[date]:Number(v)};putCfg()},
 clrT:()=>{const t={...S.cfg.targets};delete t[date];S.cfg.targets=t;putCfg()},
 addS(){const c=cid($("#sc").value),n=$("#sn").value.trim(),t=Number($("#st").value)||0;err="";if(!c||!n){err="Enter code and name";return render(true)}put("staff",c,{name:n,code:c,target:t})},
 updT:(c,v)=>{S.staff[c].target=Number(v)||0;put("staff",c,S.staff[c])},
 delS:c=>{if(confirm("Remove "+S.staff[c].name+"?"))del("staff",c)},
 updI:(i,v)=>{S.cfg.items[i]=v;putCfg()},delI:i=>{S.cfg.items.splice(i,1);putCfg()},
 addI:()=>{const v=$("#ni").value.trim();if(v){S.cfg.items.push(v);putCfg()}}};
Object.assign(window,fn);
Object.defineProperty(window,"mgrForm",{get:()=>mgrForm,set:v=>{mgrForm=v}});
Object.defineProperty(window,"err",{get:()=>err,set:v=>{err=v}});
</script></body></html>
